name: PR Preview Realm

# Each PR gets its own staging realm holding the folders it touches and what
# they reach by relative path (scripts/preview-paths.mjs). boxel's reusable
# workflow creates, pushes, publishes and unpublishes it, and keeps a sticky
# comment with the link. A failed deploy is reported there and leaves the
# check green: the preview is for reviewers, not a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-realm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paths:
    name: Choose the preview's files
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.paths.outputs.paths }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: List the preview's files
        id: paths
        run: |
          git -c core.quotePath=false diff --name-only HEAD^1 HEAD > "${RUNNER_TEMP}/changed.txt"
          paths=$(node scripts/preview-paths.mjs < "${RUNNER_TEMP}/changed.txt")
          echo "$(printf '%s' "$paths" | grep -c .) file(s) for the preview"
          {
            echo "paths<<PREVIEW_PATHS_EOF"
            printf '%s\n' "$paths"
            echo "PREVIEW_PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

  preview:
    needs: paths
    if: >-
      ${{ !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.paths.outputs.paths != '') }}
    uses: cardstack/boxel/.github/workflows/preview-realm.yml@main
    with:
      realm-server-url: https://realms-staging.stack.cards/
      matrix-url: https://matrix-staging.stack.cards
      published-realm-base: https://${{ vars.STAGING_SUBMISSIONBOT_MATRIX_USERNAME }}.staging.boxel.dev
      realm-endpoint-prefix: catalog-pr-
      display-name-prefix: Catalog PR
      sticky-header: catalog-preview-realm
      paths: ${{ needs.paths.outputs.paths }}
      fail-on-deploy-error: false
    secrets:
      matrix-username: ${{ vars.STAGING_SUBMISSIONBOT_MATRIX_USERNAME }}
      matrix-password: ${{ secrets.STAGING_SUBMISSIONBOT_MATRIX_PASSWORD }}
