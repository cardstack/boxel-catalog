name: Claude Review

# A cold reviewer on a Gold-Spec promotion PR: a fresh session that
# did not write the branch, briefed by docs/promotion-review-brief.md, posting
# findings as review comments.
#
# It reviews only what CI cannot: whether the readMe earns its place, whether
# the examples show the block working, whether the closure rebuilt something
# the catalog already has, whether the block stayed domain-neutral, and whether
# the edits made beyond the move are justified. The mechanical checks belong to
# promotion-check.yaml and are explicitly out of scope for this job.
#
# Approval and merge stay human. This job posts comments and never approves.
#
# Requires a repository or organisation secret named ANTHROPIC_API_KEY. The
# job skips itself when none is set, so it is inert until one is provisioned.

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Cold review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check for the API key
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping the cold review."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Review against the promotion brief
        if: steps.gate.outputs.enabled == 'true'
        # Pinned like every other third-party action here: this one is handed
        # the API key and a write token.
        uses: anthropics/claude-code-action@v1  # TODO: replace with a commit SHA
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number || inputs.pr }}
            in this repository.

            Read docs/promotion-review-brief.md first and follow it exactly. It
            tells you what to look at and, just as importantly, what CI already
            covers so you must not re-report it.

            You did not write this branch. Form your own view from the diff.

            Post each finding as a review comment on the line it concerns.
            Do not approve the pull request and do not merge it.
