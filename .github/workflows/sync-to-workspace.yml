name: Deploy to staging

# Syncs catalog main to the staging catalog realm on every merge. Staging runs
# boxel main, which keeps up with catalog main. Production gets the catalog from
# deploy-production.yml instead, which deploys only what the boxel production
# runs can serve.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  STAGING_WORKSPACE_URL: https://realms-staging.stack.cards/catalog/

jobs:
  sync-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    env:
      MATRIX_URL: https://matrix-staging.stack.cards
      MATRIX_USERNAME: ${{ secrets.STAGING_SUBMISSIONBOT_MATRIX_USERNAME }}
      MATRIX_PASSWORD: ${{ secrets.STAGING_SUBMISSIONBOT_MATRIX_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install Boxel CLI
        run: npm install -g @cardstack/boxel-cli@latest

      - name: Configure Boxel profile
        run: |
          if echo "$MATRIX_URL" | grep -q "boxel.ai"; then
            DOMAIN="boxel.ai"
          elif echo "$MATRIX_URL" | grep -q "stack.cards"; then
            DOMAIN="stack.cards"
          else
            DOMAIN="localhost"
          fi
          boxel profile add \
            --user "@${MATRIX_USERNAME}:${DOMAIN}" \
            --password "${MATRIX_PASSWORD}" \
            --matrix-url "${MATRIX_URL}"

      # The push skips dotfiles, but the realm applies its own copy of
      # .boxelignore, so it is written first and the push is checked against it.
      - name: Write .boxelignore to the staging realm
        run: boxel file write .boxelignore --realm "${STAGING_WORKSPACE_URL}" --file .boxelignore

      - name: Push to the staging realm
        id: sync
        run: |
          echo "Starting sync to staging workspace..."
          echo "Target workspace: ${STAGING_WORKSPACE_URL}"
          echo "Commit: ${{ github.sha }}"
          echo ""

          set +e
          OUTPUT=$(boxel realm push . "${STAGING_WORKSPACE_URL}" --delete 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          {
            echo "SYNC_OUTPUT<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "staging workspace sync failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "staging workspace sync completed successfully!"

      - name: Write staging sync report
        if: always()
        env:
          SYNC_OUTPUT: ${{ steps.sync.outputs.SYNC_OUTPUT }}
        run: |
          mkdir -p artifacts
          STATUS="${{ job.status }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          SYNCED_AT=$(date -u '+%Y-%m-%d %H:%M:%S')

          cat > artifacts/staging-sync-report.md <<EOF
          ## Staging Workspace Sync — ${STATUS}

          **Workspace:** ${STAGING_WORKSPACE_URL}
          **Commit:** ${SHORT_SHA}
          **Synced at:** ${SYNCED_AT} UTC

          ### Output
          \`\`\`
          ${SYNC_OUTPUT:-No output captured}
          \`\`\`
          EOF

      - name: Upload staging sync report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-sync-report
          path: artifacts/staging-sync-report.md
