name: Deploy to staging

# Syncs catalog main to the staging catalog realm on every merge. Staging runs
# boxel main, which keeps up with catalog main. Production gets the catalog from
# deploy-production.yml instead, which deploys only what the boxel production
# runs can serve.
#
# Each sync is recorded as a `staging` deployment here, and uploads only the
# files that changed since a revision the staging realm may hold (see "Find
# the revisions staging may hold" below).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One sync at a time. Overlapping syncs could finish out of order and leave the
# realm holding the older revision while the newer deployment is recorded as the
# one it got. Each run records its deployment once it holds the group, so the
# newest deployment is always the last sync that ran.
concurrency:
  group: catalog-deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  STAGING_WORKSPACE_URL: https://realms-staging.stack.cards/catalog/

jobs:
  sync-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    env:
      MATRIX_URL: https://matrix-staging.stack.cards
      MATRIX_USERNAME: ${{ secrets.STAGING_SUBMISSIONBOT_MATRIX_USERNAME }}
      MATRIX_PASSWORD: ${{ secrets.STAGING_SUBMISSIONBOT_MATRIX_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The push diffs against revisions staging may hold, so the history
          # has to reach them.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # The newest staging deployment that succeeded names a revision the
      # realm holds in full. Each one recorded after it failed or never
      # finished, so the realm may hold part of its revision. The push skips a
      # file only when it's unchanged against every one of these, so a file any
      # of them may have written is sent again. With no successful deployment
      # among the last 30, or a revision the checkout's history doesn't reach,
      # the push sends every file. This runs before this run records its own
      # deployment.
      - name: Find the revisions staging may hold
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revisions=""
          succeeded=false
          for row in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=30" --jq '.[] | "\(.id):\(.sha)"'); do
            id="${row%%:*}"
            sha="${row#*:}"
            case " $revisions " in
              *" $sha "*) ;;
              *) revisions="$revisions $sha" ;;
            esac
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq 'any(.[]; .state == "success")')" = "true" ]; then
              succeeded=true
              break
            fi
          done

          if [ "$succeeded" != "true" ]; then
            echo "::notice title=staging sync::No successful staging deployment is recorded, so this sync sends every file."
            revisions=""
          fi
          for revision in $revisions; do
            if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              echo "::warning title=staging sync::$revision, which staging may hold, isn't in this checkout's history, so this sync sends every file."
              revisions=""
              break
            fi
          done

          echo "Staging may hold:${revisions:- (unknown)}"
          echo "revisions=${revisions# }" >> "$GITHUB_OUTPUT"

      - name: Record the deployment
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              description: 'Catalog sync to staging',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              environment_url: process.env.STAGING_WORKSPACE_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('id', String(data.id));

      - name: Install Boxel CLI
        run: npm install -g @cardstack/boxel-cli@latest

      - name: Configure Boxel profile
        run: |
          if echo "$MATRIX_URL" | grep -q "boxel.ai"; then
            DOMAIN="boxel.ai"
          elif echo "$MATRIX_URL" | grep -q "stack.cards"; then
            DOMAIN="stack.cards"
          else
            DOMAIN="localhost"
          fi
          boxel profile add \
            --user "@${MATRIX_USERNAME}:${DOMAIN}" \
            --password "${MATRIX_PASSWORD}" \
            --matrix-url "${MATRIX_URL}"

      # The push skips dotfiles, but the realm applies its own copy of
      # .boxelignore. The realm reads it on a from-scratch index, so a changed
      # file takes effect at the next realm-server deploy.
      #
      # A deploy announces nothing to the realm's open tabs: they pick the new
      # catalog up on their next load rather than reset mid-session. A
      # boxel-cli without --no-realm-events rejects it, so that one announces.
      - name: Write .boxelignore to the staging realm
        run: |
          realm_events=()
          if grep -q -- '--no-realm-events' <<< "$(boxel file write --help 2>&1 || true)"; then
            realm_events+=(--no-realm-events)
          fi
          boxel file write .boxelignore --realm "${STAGING_WORKSPACE_URL}" --file .boxelignore "${realm_events[@]}"

      # Uploads only the files that differ from a revision staging may hold
      # (see above), plus any file git doesn't track or the realm is missing.
      # Each file the realm writes reindexes, and a push without
      # --no-realm-events also notifies every open session, so re-sending the
      # whole catalog floods the realm (and Matrix).
      - name: Push to the staging realm
        id: sync
        env:
          REVISIONS: ${{ steps.baseline.outputs.revisions }}
        run: |
          echo "Starting sync to staging workspace..."
          echo "Target workspace: ${STAGING_WORKSPACE_URL}"
          echo "Commit: ${{ github.sha }}"
          echo "Staging may hold: ${REVISIONS:-(unknown)}"
          echo ""

          # A boxel-cli without --changed-since rejects it, so that one sends
          # every file.
          changed_since=()
          push_help=$(boxel realm push --help 2>&1 || true)
          if grep -q -- '--changed-since' <<< "$push_help"; then
            for revision in $REVISIONS; do
              changed_since+=(--changed-since "$revision")
            done
          elif [ -n "$REVISIONS" ]; then
            echo "::notice::This boxel-cli has no --changed-since, so every file goes up."
          fi

          # Indexed without announcing it to the realm's open tabs (see the
          # .boxelignore step).
          realm_events=()
          if grep -q -- '--no-realm-events' <<< "$push_help"; then
            realm_events+=(--no-realm-events)
          fi

          set +e
          OUTPUT=$(boxel realm push . "${STAGING_WORKSPACE_URL}" --delete "${changed_since[@]}" "${realm_events[@]}" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          # A full push lists every file, which outgrows a step output or an
          # environment variable, so the report reads it from a file.
          echo "$OUTPUT" > "$RUNNER_TEMP/sync-output.txt"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "staging workspace sync failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "staging workspace sync completed successfully!"

      # A sync that failed partway leaves the deployment marked failed, so the
      # next sync still compares against its revision.
      - name: Finish the deployment record
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.SYNC_OUTCOME === 'success' ? 'success' : 'failure',
              environment_url: process.env.STAGING_WORKSPACE_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Write staging sync report
        if: always()
        run: |
          mkdir -p artifacts
          STATUS="${{ job.status }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          SYNCED_AT=$(date -u '+%Y-%m-%d %H:%M:%S')

          OUTPUT_FILE="$RUNNER_TEMP/sync-output.txt"
          if [ -s "$OUTPUT_FILE" ]; then
            UPLOADED=$(grep -c '^  Uploaded: ' "$OUTPUT_FILE" || true)
            SYNC_SUMMARY="$(grep -v '^  Uploaded: ' "$OUTPUT_FILE" | tail -n 200)
          (${UPLOADED} file(s) uploaded; the full list is in the job log)"
          else
            SYNC_SUMMARY="No output captured"
          fi

          cat > artifacts/staging-sync-report.md <<EOF
          ## Staging Workspace Sync — ${STATUS}

          **Workspace:** ${STAGING_WORKSPACE_URL}
          **Commit:** ${SHORT_SHA}
          **Synced at:** ${SYNCED_AT} UTC

          ### Output
          \`\`\`
          ${SYNC_SUMMARY}
          \`\`\`
          EOF

      - name: Upload staging sync report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-sync-report
          path: artifacts/staging-sync-report.md
