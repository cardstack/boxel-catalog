name: CI Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      # Checkout the boxel monorepo at root to get tooling and init action
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          repository: cardstack/boxel

      # Checkout this catalog repo directly into the monorepo's catalog location
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          path: packages/catalog/contents

      - uses: ./.github/actions/init

      # Host's tsconfig includes boxel's experiments-realm, whose type errors
      # a catalog change can't cause or fix. Drop that include for this run
      # instead of deleting the package: the package is a workspace importer
      # in boxel's lockfile, so deleting it breaks a frozen-lockfile install.
      - name: Leave experiments-realm out of host lint:types
        run: |
          sed -i '\#"\.\./experiments-realm/\*\*/\*",#d' packages/host/tsconfig.json
          if grep -q 'experiments-realm' packages/host/tsconfig.json; then
            echo "packages/host/tsconfig.json still includes experiments-realm" >&2
            exit 1
          fi

      # Boxel UI and Boxel Icons need to be built first so that their
      # linting outputs types are available for projects that depend on them
      - name: List catalog files
        run: find packages/catalog/contents -type f | sort

      - name: Build common dependencies
        if: always()
        run: pnpm run build-common-deps

      - name: Lint Host
        if: always()
        run: pnpm run lint
        working-directory: packages/host

      # packages/catalog/scripts is boxel's Node tooling for the catalog
      # (clone updates, the test-subset sync), not catalog content. The
      # catalog type check reads every .ts file in the package as CommonJS,
      # which rejects that tooling's ES-module syntax, so leave it out.
      - name: Remove boxel's catalog tooling scripts
        if: always()
        run: rm -rf packages/catalog/scripts

      - name: Lint Catalog
        if: always()
        run: pnpm run lint
        working-directory: packages/catalog